<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run: Escape from Thanksgiving</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17100a; }
  body { display: grid; place-items: center; }
  #game {
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    display: block;
    background: #17100a;
    touch-action: none;
  }
  /* Read aloud, never shown: what the screen reader announces. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Turkey Run: escape the farm, the farmer, the knives and the oven. Up or W jumps, Down or S ducks, left and right slide, Space starts and restarts, P pauses."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
